<div class="flex flex-col h-full">
  <div class="flex flex-col gap-4 mb-4">
    <section class="flex flex-col sm:flex-row sm:justify-between sm:items-stretch gap-4">
      <div class="flex flex-col gap-2">
        <h1 h1 class="text-2xl sm:text-3xl font-semibold dark:text-white">File Storages</h1>
        <p class="text-gray-500 dark:text-gray-400">Manage your file storages</p>
      </div>
      <a href="add" routerLink="add" class="button">Add file storage</a>
    </section>
    <form [formGroup]="form" class="flex gap-3">
      <div class="w-full sm:w-auto">
        <input placeholder="Search..." formControlName="search" 
               class="input placeholder:text-gray-500 dark:placeholder:text-gray-400">
      </div>
    </form>
  </div>
  
  <content-table 
    class="mt-4"
    [columns]="columns" 
    [data]="fileStorages$ | async" 
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)" />
    
</div>
