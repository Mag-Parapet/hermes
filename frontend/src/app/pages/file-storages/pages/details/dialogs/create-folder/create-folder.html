<div class="flex flex-col gap-3 p-4 lg:p-6 
            bg-white shadow-md rounded-lg
            dark:bg-gray-800 dark:border dark:border-gray-700">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
        Create New Folder
    </h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
            <label for="folderName" class="text-sm font-medium text-gray-700 dark:text-gray-300">Folder Name</label>
            <input 
                type="text" 
                id="folderName" 
                name="folderName" 
                formControlName="name"
                required 
                class="input"
                placeholder="Enter folder name">
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" class="button-outline" (click)="onCancel()">Cancel</button>
            <button type="submit" [disabled]="form.invalid" class="button">Create Folder</button>
        </div>
    </form>
</div>
