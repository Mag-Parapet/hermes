<div class="flex flex-col gap-3 p-4 lg:p-8
            bg-white shadow-md rounded-lg dark:text-white
            dark:bg-gray-800 dark:border dark:border-gray-700">
    <div class="flex gap-2 w-fit mb-3">
        @for (variant of variants(); track variant) {
        <a class="px-3 py-1.5 text-sm font-medium
            bg-gray-100 dark:bg-gray-700 rounded-md
            hover:bg-gray-200 dark:hover:bg-gray-600 cursor-pointer"
            (click)="selectedVariant.set(variant);" 
            [class.bg-primary-200]="selectedVariant() === variant" 
            [class.hover:bg-primary-300]="selectedVariant() === variant" 
            [class.dark:bg-primary-700]="selectedVariant() === variant" 
            [class.dark:hover:bg-primary-600]="selectedVariant() === variant">
            {{ variant }}
        </a>
        }
    </div>
    <div class="flex justify-center">
        @if (!file.variants[selectedVariant()]) {
            <p class="text-gray-500 dark:text-gray-400">No preview available for the selected variant.</p>
        }
        <div class="relative w-full min-h-[20vh] max-h-[80vh] border border-gray-200 rounded-xl dark:border-gray-700 scale-[1.005]" #blurhashContainer [class.hidden]="selectedVariant() !== 'blurhash'">
            <canvas class="absolute inset-0 h-full w-full object-cover rounded-xl" #blurhashCanvas></canvas>
        </div>
        <img 
            [src]="selectedVariantImage()" 
            alt="Image Preview" 
            #sampleImage
            [class.hidden]="selectedVariant() === 'blurhash'"
            class="w-full min-h-[30vh] max-h-[80vh] rounded-xl border border-gray-200 dark:border-gray-700" />
    </div>
</div>
