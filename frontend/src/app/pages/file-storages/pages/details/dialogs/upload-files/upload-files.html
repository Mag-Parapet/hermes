<div class="relative group w-full max-w-2xl mx-auto cursor-pointer focus:outline-none" (click)="fileInput.click()"
    (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">

    <div class="flex flex-col items-center justify-center w-full h-64 rounded-2xl transition-all duration-300 ease-in-out border-4"
        [class.border-dashed]="!isDragging()" [class.border-solid]="isDragging()"
        [class.border-gray-300]="!isDragging()" [class.dark:border-gray-600]="!isDragging()"
        [class.bg-white]="!isDragging()" [class.dark:bg-gray-800]="!isDragging()" [class.border-blue-500]="isDragging()"
        [class.bg-blue-50]="isDragging()" [class.dark:bg-gray-700]="isDragging()" [class.scale-[1.02]]="isDragging()"
        [class.shadow-xl]="isDragging()">

        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center pointer-events-none">

            <h3 class="mb-2 text-xl font-bold text-gray-700 dark:text-gray-200">
                Upload Files
            </h3>

            <p class="mb-8 text-sm text-gray-500 dark:text-gray-400">
                Drag and drop your files here or click to select
            </p>

            <button type="button"
                class="flex items-center gap-2 px-6 py-3 text-white transition-all duration-300 bg-gray-900 rounded-lg hover:bg-gray-700 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-200"
                [class.opacity-0]="isDragging()" [class.translate-y-4]="isDragging()">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                </svg>

                <span class="text-base font-semibold">Choose Files</span>
            </button>

            <div class="pointer-events-none absolute inset-0 flex items-center justify-center rounded-2xl bg-white/60 backdrop-blur-sm transition-opacity duration-300 dark:bg-gray-800/60"
                [class.opacity-0]="!isDragging()" [class.opacity-100]="isDragging()">
                <p class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 animate-bounce">
                    Drop files here
                </p>
            </div>

        </div>
    </div>
</div>

<input type="file" id="fileInput" #fileInput (change)="onUploadFiles($event)" class="hidden" multiple>
