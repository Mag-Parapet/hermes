<div class="absolute right-4 top-4 z-10 bg-white p-2 flex items-center justify-center rounded-md shadow-sm cursor-pointer hover:bg-gray-50
         dark:bg-gray-800 dark:hover:bg-gray-700 dark:border dark:border-gray-700" (click)="onToggleTheme()">
  <span class="material-symbols-outlined scale-90 text-gray-600! select-none dark:text-gray-300!">
    {{ isDarkMode() ? 'dark_mode' : 'light_mode' }}
  </span>
</div>

<div class="min-h-dvh flex items-center justify-center bg-gray-100 dark:bg-gray-900 p-4">

  <div class="bg-white rounded-lg shadow-md p-6 sm:p-8 w-full max-w-md space-y-6
              dark:bg-gray-800 dark:shadow-none dark:border dark:border-gray-700">

    <div class="flex flex-col items-center text-center">
      <div class="flex items-center justify-center gap-3">
        <img class="h-12" src="/logo.png" />
        <h2 class="text-3xl sm:text-5xl font-bold tracking-tight text-gray-900 dark:text-white">
          Hermes
        </h2>
      </div>

      <p class="mt-2 text-gray-500 dark:text-gray-400">
        Sign in to your account
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="flex flex-col gap-4">

      <section class="flex flex-col">
        <label for="email" class="block font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
        <input id="email" name="email" type="email" required placeholder="user@example.com" formControlName="email"
            class="input">
        <div class="form-error" [class.hidden]="!isInvalid('email')">Please enter a valid email address.</div>
      </section>

      <section class="flex flex-col">
        <label for="password" class="block font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
        <input id="password" name="password" type="password" required placeholder="qwerty12345" formControlName="password"
            class="input">
        <div class="form-error" [class.hidden]="!isInvalid('password')">
          Password is required and must be at least 6 characters long.
        </div>
      </section>

      <button class="button w-full mt-4">Login</button>

    </form>

  </div>
</div>
